plugins {
    id "com.android.application"
}

android {
    namespace "com.jhooni467.astroweb"
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId "com.jhooni467.astroweb"
        minSdk 26
        targetSdk 36
        versionCode 18
        versionName "0.18"
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:160.0.20261116130455"
}
