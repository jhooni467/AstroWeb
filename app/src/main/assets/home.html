<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121514">
<title>Nueva pestaña · AstroWeb</title>
<style>
:root{
  color-scheme:dark;
  --bg:#121514;
  --surface:#1b211d;
  --surface-2:#202822;
  --line:rgba(190,207,188,.10);
  --text:#edf0eb;
  --muted:#a2aca0;
  --sage:#a9bea6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{
  min-height:100vh;
  color:var(--text);
  font-family:system-ui,-apple-system,Roboto,sans-serif;
  padding:clamp(26px,6vh,54px) 20px 34px;
  overflow-x:hidden;
  background:
    radial-gradient(ellipse at 78% 7%,rgba(122,151,121,.10),transparent 34%),
    radial-gradient(ellipse at 5% 65%,rgba(103,130,105,.07),transparent 32%),
    var(--bg);
}
body:before{
  content:"";
  position:fixed;
  width:310px;height:310px;
  top:-180px;right:-120px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(174,198,168,.12),transparent 68%);
  filter:blur(8px);
  pointer-events:none;
  animation:drift 12s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:translate3d(-8px,0,0) scale(.96);opacity:.65}to{transform:translate3d(18px,24px,0) scale(1.06);opacity:1}}
main{width:100%;max-width:720px;margin:0 auto;position:relative}
.topline{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:10px;letter-spacing:.19em;font-weight:650}
.dot{width:6px;height:6px;border-radius:50%;background:var(--sage);box-shadow:0 0 12px rgba(169,190,166,.35)}
h1{font-size:clamp(27px,7vw,35px);line-height:1.14;letter-spacing:-.045em;font-weight:620;margin:20px 0 8px;animation:appear .55s cubic-bezier(.2,.8,.2,1) both}
.lead{font-size:13px;color:var(--muted);margin:0 0 34px;line-height:1.6;animation:appear .65s .04s cubic-bezier(.2,.8,.2,1) both}
.section{font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:650;margin:0 0 12px}
.sites{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.site{
  min-height:76px;
  display:flex;align-items:center;gap:13px;
  padding:14px;
  color:var(--text);text-decoration:none;
  background:linear-gradient(145deg,rgba(35,44,37,.95),rgba(25,31,27,.94));
  border:1px solid var(--line);
  border-radius:15px;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s,background .22s;
  animation:appear .6s cubic-bezier(.2,.8,.2,1) both;
}
.site:nth-child(2){animation-delay:.06s}.site:nth-child(3){animation-delay:.12s}.site:nth-child(4){animation-delay:.18s}
.site:active{transform:scale(.975);border-color:rgba(169,190,166,.34);background:var(--surface-2)}
.symbol{
  width:34px;height:34px;flex:0 0 34px;
  display:grid;place-items:center;
  border-radius:11px;
  background:rgba(169,190,166,.10);
  color:var(--sage);font-size:15px;font-weight:700;
}
.site-name{font-size:13px;font-weight:560}
.site-arrow{margin-left:auto;color:#758275;font-size:17px}
@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:600px){.sites{grid-template-columns:repeat(4,minmax(0,1fr))}.site{min-height:88px;align-items:flex-start;flex-direction:column;justify-content:space-between}.site-arrow{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<div class="topline"><span class="dot"></span> ASTROWEB <span>·</span> EXPLORAR</div>
<h1>Explora.</h1>
<p class="lead">Un lugar tranquilo para empezar tu siguiente búsqueda.</p>
<p class="section">ACCESOS DIRECTOS</p>
<nav class="sites" aria-label="Sitios frecuentes">
<a class="site" href="https://www.google.com/"><span class="symbol">G</span><span class="site-name">Google</span><span class="site-arrow">↗</span></a>
<a class="site" href="https://www.youtube.com/"><span class="symbol">▶</span><span class="site-name">YouTube</span><span class="site-arrow">↗</span></a>
<a class="site" href="https://www.wikipedia.org/"><span class="symbol">W</span><span class="site-name">Wikipedia</span><span class="site-arrow">↗</span></a>
<a class="site" href="https://github.com/"><span class="symbol">⌘</span><span class="site-name">GitHub</span><span class="site-arrow">↗</span></a>
</nav>
</main>
</body>
</html>
