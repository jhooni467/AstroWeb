<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b1b">
  <title>AstroWeb</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f1ff;
      --muted: #aaa8c7;
      --violet: #aa9cff;
      --glass: rgba(255,255,255,.055);
      --line: rgba(191,181,255,.15);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(92,75,173,.25), transparent 48%),
        radial-gradient(ellipse at 5% 95%, rgba(39,90,144,.16), transparent 42%),
        linear-gradient(155deg, #090b1b 0%, #101027 56%, #090b1b 100%);
      display: grid;
      place-items: center;
      padding: 34px 22px;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 18%, #fff 98%, transparent),
        radial-gradient(1px 1px at 77% 13%, #d9d0ff 98%, transparent),
        radial-gradient(1px 1px at 84% 65%, #fff 98%, transparent),
        radial-gradient(1.5px 1.5px at 26% 78%, #d9d0ff 98%, transparent),
        radial-gradient(1px 1px at 61% 88%, #fff 98%, transparent),
        radial-gradient(1px 1px at 45% 29%, #fff 98%, transparent);
      opacity: .45;
      animation: shimmer 9s ease-in-out infinite alternate;
    }
    body::after { transform: translateY(2px); opacity: .2; animation-duration: 13s; }
    @keyframes shimmer { from { opacity: .18; } to { opacity: .52; } }
    main { width: min(100%, 520px); position: relative; z-index: 1; text-align: center; }
    .orb {
      width: 78px; height: 78px; margin: 0 auto 23px; border-radius: 50%;
      display: grid; place-items: center; font-size: 34px; color: #e8e0ff;
      background: radial-gradient(circle at 35% 28%, #62579b, #26234d 58%, #111326 100%);
      border: 1px solid rgba(211,201,255,.24);
      box-shadow: 0 0 55px rgba(137,117,255,.22), inset 0 1px 12px rgba(255,255,255,.18);
    }
    .eyebrow { color: var(--violet); font-size: 10px; letter-spacing: .28em; font-weight: 700; }
    h1 { font-size: clamp(34px, 10vw, 49px); letter-spacing: -.055em; margin: 10px 0 8px; font-weight: 650; }
    .tagline { color: var(--muted); font-size: 13px; letter-spacing: .035em; margin: 0; }
    .line { height: 1px; width: 42px; margin: 29px auto; background: linear-gradient(90deg, transparent, #a99bff, transparent); }
    .section-label { color: var(--muted); font-size: 10px; letter-spacing: .2em; margin: 0 0 13px; }
    .links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    a {
      min-height: 58px; display: flex; align-items: center; gap: 11px;
      text-decoration: none; color: var(--ink); text-align: left;
      padding: 13px 15px; border-radius: 17px;
      background: var(--glass); border: 1px solid var(--line);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      transition: transform .22s ease, background .22s ease, border-color .22s ease;
    }
    a:active { transform: scale(.97); background: rgba(169,155,255,.13); }
    .symbol { width: 27px; height: 27px; border-radius: 9px; display: grid; place-items: center; color: #d8d0ff; background: rgba(169,155,255,.12); font-size: 14px; }
    .name { font-size: 12px; font-weight: 600; }
    footer { margin-top: 34px; color: rgba(170,168,199,.55); font-size: 9px; letter-spacing: .18em; }
    @media (min-width: 480px) { .links { grid-template-columns: repeat(4, minmax(0, 1fr)); } a { flex-direction: column; justify-content: center; min-height: 84px; gap: 7px; text-align: center; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true">✦</div>
    <div class="eyebrow">YOUR WINDOW TO THE UNIVERSE</div>
    <h1>AstroWeb</h1>
    <p class="tagline">Explore beyond the ordinary.</p>
    <div class="line"></div>
    <p class="section-label">QUICK ACCESS</p>
    <nav class="links" aria-label="Quick access">
      <a href="https://www.wikipedia.org/"><span class="symbol">W</span><span class="name">Wikipedia</span></a>
      <a href="https://www.youtube.com/"><span class="symbol">▶</span><span class="name">YouTube</span></a>
      <a href="https://github.com/"><span class="symbol">⌘</span><span class="name">GitHub</span></a>
      <a href="https://www.google.com/"><span class="symbol">G</span><span class="name">Google</span></a>
    </nav>
    <footer>ASTROWEB · VERSION 0.01</footer>
  </main>
</body>
</html>
