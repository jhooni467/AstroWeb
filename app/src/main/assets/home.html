<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101117">
<title>Nueva pestaña</title>
<style>
:root{color-scheme:dark;--text:#eeeeF4;--muted:#a0a1ad;--line:#30313b;--accent:#bcaeff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#101117}
body{min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,Roboto,sans-serif;padding:22px 18px}
main{width:100%;max-width:760px;margin:0 auto}
h1{font-size:13px;line-height:1.4;font-weight:600;color:var(--muted);margin:0 0 12px}
.sites{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:26px}
a{min-width:0;min-height:48px;display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;border-bottom:1px solid var(--line);font-size:14px}
a:active{color:var(--accent)}
.symbol{display:flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 22px;color:var(--accent);font-size:15px;font-weight:600}
@media(min-width:600px){.sites{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
<h1>Accesos directos</h1>
<nav class="sites" aria-label="Sitios frecuentes">
<a href="https://www.google.com/"><span class="symbol">G</span><span>Google</span></a>
<a href="https://www.youtube.com/"><span class="symbol">▶</span><span>YouTube</span></a>
<a href="https://www.wikipedia.org/"><span class="symbol">W</span><span>Wikipedia</span></a>
<a href="https://github.com/"><span class="symbol">⌘</span><span>GitHub</span></a>
</nav>
</main>
</body>
</html>
