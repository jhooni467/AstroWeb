name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AstroWeb APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.2 build-tools;37.0.0"

      - name: Build ABI-specific debug APKs
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload architecture-specific APKs
        uses: actions/upload-artifact@v4
        with:
          name: AstroWeb-0.02-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
